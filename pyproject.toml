[project]
name = "vader"
version = "1.0.0"
description = "Tape Archive Control Application — LTO library control, catalog, verification and guided restore"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# UP042: keep `str, Enum` bases — explicit and unambiguous for SQLAlchemy + JSON.
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
